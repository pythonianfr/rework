[build-system]
requires = ["setuptools >= 70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rework"
dynamic = ["version"]
authors = [
    {name = "Aurélien Campéas", email = "aurelien.campeas@pythonian.fr"},
]
description = "A database backed distributed task dispatcher"
readme = "README.md"
requires-python = ">= 3.10"
license = "LGPL-3.0-or-later"
keywords = ["database", "task-queue", "distributed", "worker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Object Brokering",
]
dependencies = [
    "psutil",
    "colorama",
    "sqlhelp",
    "click",
    "tzlocal",
    "isodate",
    "inireader",
    "python-icron",
    "pystuck",
    "pyzstd",
    "python-dateutil",
    "psyl",
    "pytz",
]

[project.optional-dependencies]
test = ["pytest"]
debug = ["pystuck"]

[project.urls]
Homepage = "https://hg.sr.ht/~pythonian/rework"
Repository = "https://heptapod.host/pythonian/timeseries-refinery/rework"
Documentation = "https://refinery.docs.pythonian.fr"

[project.scripts]
rework = "rework.cli:rework"

[tool.setuptools.packages.find]
include = ["rework*"]

[tool.setuptools.package-data]
rework = ["schema.sql"]

[tool.setuptools.dynamic]
version = {attr = "rework.__version__"}

[tool.pytype]
inputs = ['rework']

[tool.ruff]
lint.ignore = ["E501", "E702", "E722", "E731"]
